<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#09090d"/>
  <rect x="200" y="80" width="800" height="500" rx="12" fill="#111118" stroke="#28283a" stroke-width="1"/>
  <rect x="200" y="80" width="800" height="40" rx="12" fill="#1a1a24"/>
  <rect x="200" y="108" width="800" height="12" fill="#1a1a24"/>
  <circle cx="232" cy="100" r="6" fill="#f87171" opacity="0.8"/>
  <circle cx="256" cy="100" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="280" cy="100" r="6" fill="#4ade80" opacity="0.8"/>

  <!-- Command -->
  <text x="240" y="160" font-family="'Courier New',monospace" font-size="16" fill="#7c6cf6">$</text>
  <text x="262" y="160" font-family="'Courier New',monospace" font-size="16" fill="#e2e2e9">npx @rafaelmelo007/vskit init</text>

  <line x1="240" y1="180" x2="960" y2="180" stroke="#1e1e2a" stroke-width="1"/>

  <!-- Output -->
  <text x="240" y="220" font-family="'Courier New',monospace" font-size="15" fill="#4ade80">✔</text>
  <text x="265" y="220" font-family="'Courier New',monospace" font-size="15" fill="#9395a8">.claude/commands/vskit/</text>
  <text x="620" y="220" font-family="'Courier New',monospace" font-size="15" fill="#e2e2e9">35 commands installed</text>

  <text x="240" y="260" font-family="'Courier New',monospace" font-size="15" fill="#4ade80">✔</text>
  <text x="265" y="260" font-family="'Courier New',monospace" font-size="15" fill="#9395a8">.claude/settings.json</text>
  <text x="620" y="260" font-family="'Courier New',monospace" font-size="15" fill="#e2e2e9">Stop hook wired</text>

  <text x="240" y="300" font-family="'Courier New',monospace" font-size="15" fill="#4ade80">✔</text>
  <text x="265" y="300" font-family="'Courier New',monospace" font-size="15" fill="#9395a8">CLAUDE.md</text>
  <text x="620" y="300" font-family="'Courier New',monospace" font-size="15" fill="#e2e2e9">overrides appended</text>

  <text x="240" y="340" font-family="'Courier New',monospace" font-size="15" fill="#4ade80">✔</text>
  <text x="265" y="340" font-family="'Courier New',monospace" font-size="15" fill="#9395a8">docs/</text>
  <text x="620" y="340" font-family="'Courier New',monospace" font-size="15" fill="#e2e2e9">scaffolded</text>

  <line x1="240" y1="368" x2="960" y2="368" stroke="#1e1e2a" stroke-width="1"/>

  <text x="240" y="410" font-family="'Courier New',monospace" font-size="16" fill="#7c6cf6">Done.</text>
  <text x="330" y="410" font-family="'Courier New',monospace" font-size="16" fill="#e2e2e9">All /vskit:* commands available in Claude Code.</text>

  <!-- Pill badges -->
  <rect x="240" y="440" width="100" height="28" rx="6" fill="rgba(124,108,246,0.12)" stroke="rgba(124,108,246,0.3)" stroke-width="1"/>
  <text x="290" y="458" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">Node 18+</text>
  <rect x="354" y="440" width="60" height="28" rx="6" fill="rgba(124,108,246,0.12)" stroke="rgba(124,108,246,0.3)" stroke-width="1"/>
  <text x="384" y="458" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">bash</text>
  <rect x="428" y="440" width="40" height="28" rx="6" fill="rgba(124,108,246,0.12)" stroke="rgba(124,108,246,0.3)" stroke-width="1"/>
  <text x="448" y="458" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">jq</text>
