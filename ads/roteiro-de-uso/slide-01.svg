<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#09090d"/>

  <!-- Stage columns -->
  <!-- Stage 1 -->
  <rect x="60" y="120" width="320" height="420" rx="16" fill="#111118" stroke="#28283a" stroke-width="1"/>
  <rect x="60" y="120" width="320" height="4" rx="2" fill="#f87171"/>
  <text x="220" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle" letter-spacing="2">STAGE 1</text>
  <text x="220" y="215" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Vibe Coding</text>
  <line x1="100" y1="240" x2="340" y2="240" stroke="#28283a" stroke-width="1"/>
  <text x="220" y="280" font-family="system-ui,sans-serif" font-size="14" fill="#9395a8" text-anchor="middle">Ship em 1 dia</text>
  <text x="220" y="310" font-family="system-ui,sans-serif" font-size="14" fill="#f87171" text-anchor="middle">Código lixo</text>
  <text x="220" y="340" font-family="system-ui,sans-serif" font-size="14" fill="#f87171" text-anchor="middle">Bugs em produção</text>
  <text x="220" y="370" font-family="system-ui,sans-serif" font-size="14" fill="#f87171" text-anchor="middle">Zero testes</text>
  <text x="220" y="400" font-family="system-ui,sans-serif" font-size="14" fill="#9395a8" text-anchor="middle">Funciona até o</text>
  <text x="220" y="420" font-family="system-ui,sans-serif" font-size="14" fill="#9395a8" text-anchor="middle">segundo usuário real</text>

  <!-- Stage 2 -->
  <rect x="440" y="120" width="320" height="420" rx="16" fill="#111118" stroke="#28283a" stroke-width="1"/>
  <rect x="440" y="120" width="320" height="4" rx="2" fill="#fbbf24"/>
  <text x="600" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="2">STAGE 2</text>
  <text x="600" y="215" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">PRD-Driven</text>
  <line x1="480" y1="240" x2="720" y2="240" stroke="#28283a" stroke-width="1"/>
  <text x="600" y="280" font-family="system-ui,sans-serif" font-size="14" fill="#9395a8" text-anchor="middle">Código consistente</text>
  <text x="600" y="310" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle">PRD existe</text>
  <text x="600" y="340" font-family="system-ui,sans-serif" font-size="14" fill="#f87171" text-anchor="middle">Sem rastreabilidade</text>
  <text x="600" y="370" font-family="system-ui,sans-serif" font-size="14" fill="#f87171" text-anchor="middle">Sem métricas</text>
  <text x="600" y="400" font-family="system-ui,sans-serif" font-size="14" fill="#f87171" text-anchor="middle">Drift invisível</text>

  <!-- Stage 3 -->
  <rect x="820" y="120" width="320" height="420" rx="16" fill="#111118" stroke="#7c6cf6" stroke-width="1.5"/>
  <rect x="820" y="120" width="320" height="4" rx="2" fill="#7c6cf6"/>
  <text x="980" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#7c6cf6" text-anchor="middle" letter-spacing="2">STAGE 3</text>
  <text x="980" y="215" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">vertical-slices-md-devkit</text>
  <line x1="860" y1="240" x2="1100" y2="240" stroke="#28283a" stroke-width="1"/>
  <text x="980" y="280" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle">PRD → SPEC → TASKS</text>
  <text x="980" y="310" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle">Commits rastreáveis</text>
  <text x="980" y="340" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle">Score em 8 dimensões</text>
  <text x="980" y="370" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle">Ship gate automático</text>
  <text x="980" y="400" font-family="system-ui,sans-serif" font-size="14" fill="#4ade80" text-anchor="middle">Drift vira erro</text>

  <!-- Arrows -->
  <text x="400" y="345" font-family="system-ui,sans-serif" font-size="28" fill="#28283a" text-anchor="middle">→</text>
  <text x="780" y="345" font-family="system-ui,sans-serif" font-size="28" fill="#7c6cf6" text-anchor="middle">→</text>
</svg>
