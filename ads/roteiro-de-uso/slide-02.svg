<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#09090d"/>
  <!-- Terminal window -->
  <rect x="200" y="100" width="800" height="460" rx="12" fill="#111118" stroke="#28283a" stroke-width="1"/>
  <!-- Terminal top bar -->
  <rect x="200" y="100" width="800" height="40" rx="12" fill="#1a1a24"/>
  <rect x="200" y="128" width="800" height="12" fill="#1a1a24"/>
  <circle cx="232" cy="120" r="6" fill="#f87171" opacity="0.8"/>
  <circle cx="256" cy="120" r="6" fill="#fbbf24" opacity="0.8"/>
  <circle cx="280" cy="120" r="6" fill="#4ade80" opacity="0.8"/>
  <text x="600" y="125" font-family="system-ui,sans-serif" font-size="12" fill="#62647a" text-anchor="middle">bash</text>

  <!-- Command -->
  <text x="240" y="182" font-family="'Courier New',monospace" font-size="15" fill="#7c6cf6">$</text>
  <text x="260" y="182" font-family="'Courier New',monospace" font-size="15" fill="#e2e2e9">diff prd.md código/</text>

  <!-- Output lines -->
  <text x="240" y="230" font-family="'Courier New',monospace" font-size="14" fill="#62647a">  auth model:</text>
  <text x="420" y="230" font-family="'Courier New',monospace" font-size="14" fill="#f87171">missing</text>
  <rect x="540" y="216" width="72" height="22" rx="4" fill="rgba(248,113,113,0.1)"/>
  <text x="548" y="231" font-family="'Courier New',monospace" font-size="12" fill="#f87171">✗ drift</text>

  <text x="240" y="270" font-family="'Courier New',monospace" font-size="14" fill="#62647a">  rate limit:</text>
  <text x="420" y="270" font-family="'Courier New',monospace" font-size="14" fill="#f87171">missing</text>
  <rect x="540" y="256" width="72" height="22" rx="4" fill="rgba(248,113,113,0.1)"/>
  <text x="548" y="271" font-family="'Courier New',monospace" font-size="12" fill="#f87171">✗ drift</text>

  <text x="240" y="310" font-family="'Courier New',monospace" font-size="14" fill="#62647a">  input rules:</text>
  <text x="430" y="310" font-family="'Courier New',monospace" font-size="14" fill="#f87171">missing</text>
  <rect x="540" y="296" width="72" height="22" rx="4" fill="rgba(248,113,113,0.1)"/>
  <text x="548" y="311" font-family="'Courier New',monospace" font-size="12" fill="#f87171">✗ drift</text>

  <text x="240" y="350" font-family="'Courier New',monospace" font-size="14" fill="#62647a">  latency SLO:</text>
  <text x="440" y="350" font-family="'Courier New',monospace" font-size="14" fill="#f87171">missing</text>
  <rect x="540" y="336" width="72" height="22" rx="4" fill="rgba(248,113,113,0.1)"/>
  <text x="548" y="351" font-family="'Courier New',monospace" font-size="12" fill="#f87171">✗ drift</text>

  <line x1="240" y1="378" x2="960" y2="378" stroke="#28283a" stroke-width="1"/>

  <text x="240" y="415" font-family="'Courier New',monospace" font-size="15" fill="#f87171">Drift acumulado.</text>
  <text x="240" y="445" font-family="'Courier New',monospace" font-size="15" fill="#62647a">Sem sinal de alerta.</text>

  <!-- Cursor -->
  <rect x="240" y="478" width="10" height="18" rx="1" fill="#7c6cf6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
